name: mdg-mt5-local
services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: mdg_mt5_local
      POSTGRES_USER: mdg_local
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - mt5-test-db:/var/lib/postgresql/data
    networks:
      - test-db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mdg_local -d mdg_mt5_local"]
      interval: 3s
      timeout: 3s
      retries: 20
  gateway:
    image: ${MT5_LOCAL_MDG_IMAGE:?Set a local MDG image containing the locked dependencies}
    environment:
      PYTHONPATH: /app
      DATABASE_URL: postgresql+asyncpg://mdg_local@database:5432/mdg_mt5_local
      ECONOMIC_CALENDAR_POLL_SECONDS: 300
      MT5_ENABLED: true
      MT5_TOKEN_FILE: /run/mt5-token
      LOG_LEVEL: WARNING
      SOURCE_REVISION: ${MT5_LOCAL_SOURCE_REVISION:-local-working-tree}
    volumes:
      - ./app:/app/app:ro
      - ./alembic:/app/alembic:ro
      - ./scripts:/app/scripts:ro
      - ./alembic.ini:/app/alembic.ini:ro
      - ${MT5_LOCAL_TOKEN_FILE:?Set private token file outside Git}:/run/mt5-token:ro
    ports:
      - "127.0.0.1:18081:8000"
    networks:
      test-db:
      terminal:
        aliases: [mdg-tcp-smoke.test]
    depends_on:
      database:
        condition: service_healthy
networks:
  test-db:
    internal: true
  terminal:
    external: true
    name: mt5-provider-local_default
volumes:
  mt5-test-db:
