name: signapse-prod-mdg
services:
  gateway:
    image: ${MDG_IMAGE:?Immutable MDG image required}
    restart: unless-stopped
    user: '10001:10001'
    init: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    cpus: 1
    mem_limit: 768m
    memswap_limit: 768m
    stop_grace_period: 30s
    tmpfs:
      - /tmp:size=134217728,mode=1777
    environment:
      HOME: /tmp
      XDG_CACHE_HOME: /tmp/cache
      LOG_LEVEL: INFO
      DATABASE_POOL_SIZE: '5'
      DATABASE_POOL_MAX_OVERFLOW: '2'
      DATABASE_POOL_TIMEOUT_SECONDS: '5'
      ECONOMIC_CALENDAR_POLL_SECONDS: '300'
      MT5_ENABLED: 'true'
      MT5_TOKEN_FILE: /tmp/mt5-token
    env_file: /opt/signapse-prod/mdg/runtime.env
    command:
      - sh
      - -ec
      - |
        umask 077
        printf '%s' "$$MT5_TOKEN" > /tmp/mt5-token
        unset MT5_TOKEN
        exec uvicorn app.main:app --host 0.0.0.0 --port 8000
    networks:
      database:
      mt5:
        aliases: [mdg-tcp-smoke.test]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=4).close()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: '3'
networks:
  database:
    external: true
    name: signapse-prod_default
  mt5:
    external: true
    name: signapse-prod-mt5
